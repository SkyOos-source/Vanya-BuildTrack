services:
  buildtrack-postgres:
    profiles: ["prod"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildtrack}
      POSTGRES_USER: ${POSTGRES_USER:-buildtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment root .env}
    volumes:
      - buildtrack-prod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  buildtrack-prod:
    profiles: ["prod"]
    build: .
    image: buildtrack:latest
    restart: unless-stopped
    depends_on:
      buildtrack-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: https://vanyabuildtrack.duckdns.org
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://${POSTGRES_USER:-buildtrack}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment root .env}@buildtrack-postgres:5432/${POSTGRES_DB:-buildtrack}?schema=public
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      MFA_ENABLED: ${MFA_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
    ports:
      - "127.0.0.1:3102:3001"
    volumes:
      - buildtrack-prod-data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  buildtrack-prod-data:
  buildtrack-prod-postgres-data:
