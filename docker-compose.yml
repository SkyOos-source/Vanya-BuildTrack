services:
  buildtrack-uat:
    profiles: ["uat"]
    build: .
    image: buildtrack:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: https://vanyabuildtrackuat.duckdns.org
      MFA_ENABLED: ${MFA_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
    ports:
      - "127.0.0.1:3101:3001"
    volumes:
      - buildtrack-uat-data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  buildtrack-prod:
    profiles: ["prod"]
    build: .
    image: buildtrack:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: https://vanyabuildtrack.duckdns.org
      MFA_ENABLED: ${MFA_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
    ports:
      - "127.0.0.1:3102:3001"
    volumes:
      - buildtrack-prod-data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  buildtrack-uat-data:
  buildtrack-prod-data:
