services:
  buildtrack-uat:
    profiles: ["uat"]
    build: .
    image: buildtrack:latest
    restart: unless-stopped
    env_file:
      - ./deploy/uat.env
    environment:
      NODE_ENV: production
      PORT: "3001"
    ports:
      - "127.0.0.1:3101:3001"
    volumes:
      - buildtrack-uat-data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  buildtrack-prod:
    profiles: ["prod"]
    build: .
    image: buildtrack:latest
    restart: unless-stopped
    env_file:
      - ./deploy/prod.env
    environment:
      NODE_ENV: production
      PORT: "3001"
    ports:
      - "127.0.0.1:3102:3001"
    volumes:
      - buildtrack-prod-data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  buildtrack-uat-data:
  buildtrack-prod-data:
