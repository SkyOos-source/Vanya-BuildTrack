services:
  buildtrack-postgres-local:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildtrack_local
      POSTGRES_USER: buildtrack
      POSTGRES_PASSWORD: buildtrack-local-dev-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - buildtrack-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  buildtrack-local-postgres-data:
